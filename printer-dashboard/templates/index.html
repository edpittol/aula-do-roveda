<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Toner</title>
</head>
<body>
    <h1>Dashboard de Impressoras</h1>
    {% if printers %}
        <ul>
        {% for printer in printers %}
            <li>
                {{ printer.label }} —
                {% if printer.toner is none %}
                    <span style="color: gray; font-style: italic;">Inacessível</span>
                {% else %}
                    {{ printer.toner }}%
                {% endif %}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Nenhuma impressora configurada</p>
    {% endif %}
</body>
</html>
